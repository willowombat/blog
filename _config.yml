# Site settings
title: Willowombat's Blog
brief-intro: Personal journal — life, fractals, chess, mathematics & more
baseurl: "/blog"
url: "https://willowombat.github.io"

permalink: /:categories/:year/:month/:day/:title/

# other links
github_username: willowombat
email: no@no.com
# twitter_username:
# facebook_username:
# weibo_username:
# zhihu_username:
# linkedIn_username:
# dribbble_username:

category_dir: category
tag_dir: tag

description_footer: Willowombat's corner of the internet.

# comments — sign up at disqus.com to get your own shortname
# disqus_shortname: your_disqus_shortname

# statistic analysis
# google_analytics_id: UA-xxxxxxxx

# excerpt separator — 4 blank lines in a post = excerpt break on homepage
excerpt_separator: "\n\n\n\n"

# Build settings
markdown: kramdown
highlighter: rouge

gems:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

paginate: 10
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
